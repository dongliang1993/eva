appId: com.eva.desktop
productName: Eva
directories:
  output: release
files:
  - dist-electron/**/*
  - "!node_modules"
  - "!electron"
  - "!scripts"
  - "!build"
  - "!release"
  - "!.server-deploy"
extraResources:
  - from: ../../apps/server/dist/
    to: server/dist/
    filter:
      - "**/*"
  - from: .server-deploy/node_modules/
    to: server/node_modules/
    filter:
      - "**/*"
  - from: ../../apps/server/package.json
    to: server/package.json
  - from: ../../apps/server/SOUL.md
    to: server/SOUL.md
  - from: ../../apps/web/dist/
    to: web/dist/
    filter:
      - "**/*"
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        - arm64
