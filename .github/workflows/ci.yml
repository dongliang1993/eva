# Eva CI —— 每个 Wave 的退出闸门(总纲 §12.0 规约 3)。
#
# 为什么要有它、为什么要跑矩阵:2026-08-30 本机 Node 升到 v26 之后,better-sqlite3 的
# 预编译产物(ABI 133)加载失败,44 个测试文件、269 个用例静默全红,而因为没有 CI,
# 没有任何人发现。单钉一个版本挡不住这类问题(CI 绿而开发机红),所以跑「支持范围的两端」。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # 一个版本红不该掩盖另一个版本的结果 —— 这正是上面那次事故的教训。
      fail-fast: false
      matrix:
        # 支持范围的两端:22 = tsup 的 target(apps/server/tsup.config.ts),
        # 26 = 当前开发机版本。中间版本不测 —— 两端过了基本就过了。
        node: ["22", "26"]

    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 字段决定,不在这里重复写死。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # better-sqlite3 在 CI 上要 node-gyp 现编(ubuntu runner 自带工具链)。
      # 允许它跑安装脚本的开关在 pnpm-workspace.yaml 的 onlyBuiltDependencies。
      - name: Install
        run: pnpm install --frozen-lockfile

      # 分成三步而不是一句 pnpm verify —— CI 页面上要能一眼看出是哪一关红的。
      - name: 架构边界 (lint:arch)
        run: pnpm lint:arch

      - name: 类型检查
        run: pnpm typecheck

      - name: 测试
        run: pnpm test

      # 构建产物只验「能不能构建出来」。桌面壳打包需要 macOS + 签名,不进 CI。
      - name: 构建 server
        run: pnpm --filter @eva/server build

      - name: 构建 web
        run: pnpm web:build
